<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정보과학 과세특 8단계 활동 기록</title>
<style>:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#19283b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:30px 18px 70px}header{background:linear-gradient(115deg,#173b70,#2665a3);color:white;border-radius:18px;padding:30px}h1{margin:0 0 12px;font-size:27px}header p{margin:0;line-height:1.7}.panel,.step{background:white;border:1px solid #dce5f0;border-radius:15px;padding:22px;margin-top:17px;box-shadow:0 3px 12px #1c35500a}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:700;margin-bottom:8px}input,textarea{font:inherit;width:100%;border:1px solid #bdcad9;border-radius:9px;padding:12px;background:#fff;color:#182b40}input:focus,textarea:focus{outline:2px solid #80b5ec;border-color:#2473c0}textarea{min-height:165px;line-height:1.8;resize:vertical}.step h2{font-size:20px;margin:0 0 8px}.hint{color:#47617d;margin:0 0 14px;line-height:1.65}.count{text-align:right;font-size:12px;color:#61768d;margin-top:5px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:10px;padding:13px 19px;background:#2165aa;color:#fff}button.secondary{background:#e8eff8;color:#214d7d}button.danger{background:#fff0f0;color:#a33434}.notice{font-size:14px;color:#4c6178;line-height:1.8}#status{margin-top:12px;font-weight:700;color:#155e46}footer{margin-top:22px;color:#62758a;font-size:13px}@media(max-width:600px){.fields{grid-template-columns:1fr}h1{font-size:23px}.wrap{padding:12px}}</style></head>
<body><main class="wrap"><header><h1>정보과학 교과 세부능력 및 특기사항<br>8단계 탐구 활동 기록</h1><p>학번과 이름을 입력하고 각 단계의 본인의 실제 활동을 구체적으로 작성하세요.<br>작성한 전체 기록은 TXT 파일로 내려받을 수 있습니다.</p></header>
<section class="panel"><div class="fields"><div><label for="studentId">학번 <span aria-hidden="true">*</span></label><input id="studentId" placeholder="" autocomplete="off" maxlength="30"></div><div><label for="studentName">이름 <span aria-hidden="true">*</span></label><input id="studentName" placeholder="" autocomplete="off" maxlength="30"></div></div><p class="notice">*입력 내용은 서버로 전송되지 않으며, 이 브라우저에 임시 저장됩니다.</p></section>
<div id="steps"></div><section class="panel"><h2>기록 파일 저장</h2><p class="notice">파일명: <strong>학번_이름_정보과학_기록시각.txt</strong><br>각 단계의 제목, 기록 핵심 표현, 학생 작성 내용 및 저장 시각을 포함합니다. 빈 단계도 구분하여 기록됩니다.</p><div class="actions"><button id="download">TXT 파일 다운로드</button><button id="preview" class="secondary">전체 기록 미리보기</button><button id="clear" class="danger">입력 내용 초기화</button></div><p id="status" role="status"></p><textarea id="output" aria-label="전체 기록 미리보기" readonly style="display:none;min-height:340px;margin-top:15px"></textarea></section><footer>정보과학 탐구 활동 기록 · 8단계 장문형 입력 양식</footer></main>
<script>
'use strict';
const items=[
['문제 발견','문제를 인식하고 탐구 주제를 구체화함','어떤 문제를 발견했나요? 문제를 발견한 계기와 탐구 주제를 구체적으로 기록하세요.'],
['탐구 및 분석','핵심 조건을 분석하고 해결 가능성을 탐색함','관련 개념, 입력과 출력, 제한 조건, 자료 조사 및 분석 결과를 기록하세요.'],
['알고리즘 설계','알고리즘의 특성을 비교하여 적절한 방법을 선정함','비교한 알고리즘과 자료구조, 선택 이유, 의사코드나 설계 과정을 기록하세요.'],
['프로그래밍 구현','함수와 자료구조를 활용하여 프로그램을 구현함','사용한 언어와 라이브러리, 주요 함수, 핵심 코드의 역할 및 구현 과정을 기록하세요.'],
['실행 및 검증','테스트 사례를 구성하여 정확성을 검증함','정상·경계·예외 입력, 예상 결과와 실제 결과, 검증 근거를 기록하세요.'],
['오류 수정 및 개선','오류 원인을 추적하고 알고리즘의 효율성을 개선함','발생한 오류, 원인, 수정 과정, 시간·공간 복잡도 및 개선 결과를 기록하세요.'],
['심화 탐구 및 확장','기존 방법의 한계를 분석하고 적용 범위를 확장함','다른 해결 방법과 비교하거나 새로운 상황에 적용한 심화 탐구를 기록하세요.'],
['성과 및 역량 성장','논리적 사고력과 자기주도적 문제해결 역량을 보여줌','결과물, 학습한 점, 근거 있는 성취와 향후 개선 방향을 기록하세요.']
];
const $=id=>document.getElementById(id), storageKey='info_science_8step_draft_v1';
items.forEach((it,i)=>{const section=document.createElement('section');section.className='step';const h=document.createElement('h2');h.textContent=`${i+1}. ${it[0]}`;const p=document.createElement('p');p.className='hint';p.textContent=`기록 핵심 표현: ${it[1]}`;const lab=document.createElement('label');lab.htmlFor=`step${i}`;lab.textContent='학생 탐구 활동 상세 기록';const ta=document.createElement('textarea');ta.id=`step${i}`;ta.placeholder=it[2];ta.setAttribute('aria-describedby',`count${i}`);const count=document.createElement('div');count.className='count';count.id=`count${i}`;count.textContent='0자';ta.addEventListener('input',()=>{count.textContent=`${ta.value.length.toLocaleString()}자`;saveDraft()});section.append(h,p,lab,ta,count);$('steps').append(section)});
function saveDraft(){try{localStorage.setItem(storageKey,JSON.stringify({id:$('studentId').value,name:$('studentName').value,steps:items.map((_,i)=>$('step'+i).value)}))}catch(e){$('status').textContent='브라우저 임시 저장을 사용할 수 없습니다. TXT 파일로 저장하세요.'}}
function restore(){try{const s=JSON.parse(localStorage.getItem(storageKey)||'null');if(!s)return;$('studentId').value=s.id||'';$('studentName').value=s.name||'';items.forEach((_,i)=>{const v=String(s.steps?.[i]||'');$('step'+i).value=v;$('count'+i).textContent=`${v.length.toLocaleString()}자`})}catch(e){}}
$('studentId').addEventListener('input',saveDraft);$('studentName').addEventListener('input',saveDraft);restore();
function stamp(d){return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`}
function content(d){const lines=['정보과학 교과 세부능력 및 특기사항 8단계 탐구 활동 기록', '='.repeat(54),`학번: ${$('studentId').value.trim()}`,`이름: ${$('studentName').value.trim()}`,`기록시각: ${d.toLocaleString('ko-KR')}`,''];items.forEach((it,i)=>{lines.push('-'.repeat(54),`${i+1}. ${it[0]}`,`기록 핵심 표현: ${it[1]}`,'[학생 탐구 활동 상세 기록]',$('step'+i).value.trim()||'(미작성)','')});return lines.join('\r\n')}
$('preview').addEventListener('click',()=>{const o=$('output');o.value=content(new Date());o.style.display=o.style.display==='none'?'block':'none';$('status').textContent=o.style.display==='block'?'전체 기록 미리보기를 표시했습니다.':''});
$('download').addEventListener('click',()=>{const id=$('studentId').value.trim(),name=$('studentName').value.trim();if(!id||!name){alert('학번과 이름을 모두 입력하세요.');(!id?$('studentId'):$('studentName')).focus();return}const d=new Date();const safe=s=>s.replace(/[\\/:*?"<>|\x00-\x1f]/g,'-').replace(/\s+/g,'_').slice(0,50);const filename=`${safe(id)}_${safe(name)}_정보과학_${stamp(d)}.txt`;const blob=new Blob(['\ufeff',content(d)],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);$('status').textContent=`파일 다운로드를 요청했습니다: ${filename}`});
$('clear').addEventListener('click',()=>{if(!confirm('학번, 이름과 8단계 기록을 모두 초기화하시겠습니까?'))return;$('studentId').value='';$('studentName').value='';items.forEach((_,i)=>{$('step'+i).value='';$('count'+i).textContent='0자'});localStorage.removeItem(storageKey);$('output').style.display='none';$('status').textContent='입력 내용이 초기화되었습니다.'});
</script></body></html>
