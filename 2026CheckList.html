<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2026 정보과학 수행과제 제출확인</title><style>
:root{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#15283d;background:#f2f6fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:20px}header{background:#164d83;color:white;border-radius:15px;padding:25px}h1{font-size:26px;margin:0 0 8px}.panel{background:white;border:1px solid #dce5ee;border-radius:14px;padding:20px;margin:15px 0}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}.links a{color:#175a9d;text-decoration:none;padding:9px;background:#eef5fc;border-radius:7px}.identity{display:grid;grid-template-columns:1fr 1fr;gap:12px}input[type=text]{width:100%;padding:10px;border:1px solid #bac9da;border-radius:7px;font:inherit;margin-top:5px}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.score{background:#edf5ff;border-radius:10px;padding:14px;text-align:center}.score strong{display:block;font-size:25px;margin:8px 0}.task{border:1px solid #d8e2ed;border-radius:10px;padding:15px;margin:11px 0}.task h3{font-size:16px;margin:0 0 7px}.due{color:#5a6779;font-size:13px}.options{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}.options label{padding:9px 11px;border:1px solid #d6e0ea;border-radius:8px;cursor:pointer}.options input{accent-color:#1563a5}button{background:#155b99;border:0;border-radius:8px;padding:11px 15px;color:white;cursor:pointer;font:inherit}.actions{display:flex;gap:9px;flex-wrap:wrap}.muted{font-size:13px;color:#607083}.bar{height:10px;border-radius:10px;background:#e2e9f1;overflow:hidden}.fill{height:100%;width:0;background:#259578}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #d9e2eb;padding:8px;text-align:left}th{background:#e9f2fc}@media(max-width:600px){.identity,.scores{grid-template-columns:1fr}.wrap{padding:9px}h1{font-size:21px}}@media print{body{background:white}.actions{display:none}.panel{break-inside:avoid}}
</style></head><body><div class="wrap"><header><h1>2026 정보과학 수행과제 제출확인</h1><div>주제발표 100점 + 프로그래밍 100점 = 총 200점</div></header><section class="panel"><h2>학습자료 및 평가 링크</h2><div class="links" id="links"></div></section><section class="panel"><h2>학생 정보 및 개인별 득점</h2><div class="identity"><label>학번<input id="sid" type="text" placeholder="학번"></label><label>이름<input id="sname" type="text" placeholder="이름"></label></div><div class="scores" style="margin-top:16px"><div class="score">주제발표 영역<strong id="scoreA">0 / 100</strong></div><div class="score">프로그래밍 영역<strong id="scoreB">0 / 100</strong></div><div class="score">전체 득점<strong id="scoreT">0 / 200</strong></div></div><p id="progress" class="muted"></p><div class="bar"><div class="fill" id="fill"></div></div><p class="muted">미선택 문항은 현재 0점으로 계산됩니다. 제출 여부는 학생 자체 기록이며 실제 제출일은 교사가 확인해야 합니다.</p><div class="actions"><button onclick="saveCSV()">개인별 득점 CSV 저장</button><button onclick="saveTXT()">제출확인 TXT 저장</button><button onclick="window.print()">인쇄 / PDF 저장</button><button onclick="resetAll()">전체 초기화</button></div></section><section class="panel"><h2>Ⅰ. 주제발표 영역 (10문항 · 100점)</h2><div id="sectionA"></div></section><section class="panel"><h2>Ⅱ. 프로그래밍 영역 (10문항 · 100점)</h2><div id="sectionB"></div></section><section class="panel"><h2>개인별 점수표</h2><div style="overflow-x:auto"><table><thead><tr><th>학번</th><th>이름</th><th>주제발표 득점</th><th>프로그래밍 득점</th><th>전체 득점</th></tr></thead><tbody><tr><td id="tabId"></td><td id="tabName"></td><td id="tabA"></td><td id="tabB"></td><td id="tabT"></td></tr></tbody></table></div></section></div><script>
const TASKS=[{"section": "주제발표", "due": "2026-09-14", "title": "주제 발표1. 후위표기식 제출"}, {"section": "주제발표", "due": "2026-09-14", "title": "주제 발표2. 괄호검사 제출"}, {"section": "주제발표", "due": "2026-09-27", "title": "주제 발표3. 1,2 단원 성취도평가 산출물 3개 제출"}, {"section": "주제발표", "due": "2026-10-25", "title": "주제 발표4. 3,4 단원 성취도평가 산출물 3개 제출"}, {"section": "주제발표", "due": "2026-11-08", "title": "주제 발표5. 전단원 성취도평가 산출물 3개 제출"}, {"section": "주제발표", "due": "2026-09-27", "title": "주제 발표6. 정보과학 1단원 2단원 학습내용 관련 주제 정하고 소논문 작성"}, {"section": "주제발표", "due": "2026-12-06", "title": "주제 발표7. 정보과학 3단원 4단원 학습내용 관련 주제 정하고 소논문 작성"}, {"section": "주제발표", "due": "2026-11-29", "title": "주제 발표8. 2026 뉴스에 대한 탐구질문 보고서 탐구 질문 뉴스 선택 탐구 활동 보고서"}, {"section": "주제발표", "due": "2026-12-05", "title": "주제 발표9. 디지털 윤리 산출물 제출"}, {"section": "주제발표", "due": "2026-12-05", "title": "주제 발표10. 스마트폰 과의존 예방교육 산출물 제출"}, {"section": "프로그래밍", "due": "2026-11-07", "title": "탐구주제0: 4단원 프로젝트 계획서 및 웹 프로그래밍"}, {"section": "프로그래밍", "due": "2026-08-30", "title": "탐구주제1: 반복 내접 다각형 나선(Iterated Inscribed Polygon Spiral) 알고리즘 설계 및 프로그래밍"}, {"section": "프로그래밍", "due": "2026-09-06", "title": "탐구주제2: 괄호검사 알고리즘 설계 및 프로그래밍"}, {"section": "프로그래밍", "due": "2026-09-27", "title": "탐구주제3: 거북이로 아름다운 무지개 알고리즘 설계 및 프로그래밍"}, {"section": "프로그래밍", "due": "2026-10-11", "title": "탐구주제4: The Forest Where Our Dreams Grow 알고리즘 설계 및 프로그래밍"}, {"section": "프로그래밍", "due": "2026-10-18", "title": "탐구주제5: 2027수능9월모평 기하23번 파이썬 해석 알고리즘 설계 및 프로그래밍"}, {"section": "프로그래밍", "due": "2026-10-25", "title": "탐구주제6: 2027수능9월모평 수학기하30번 파이썬 해석 알고리즘 설계 및 프로그래밍"}, {"section": "프로그래밍", "due": "2026-11-01", "title": "탐구주제7: 정보과학 주제로 노래 만들기"}, {"section": "프로그래밍", "due": "2026-12-06", "title": "탐구주제8: 2027수능 수학 미적분30번 징검다리 해석 알고리즘 설계 및 프로그래밍"}, {"section": "프로그래밍", "due": "2026-12-13", "title": "탐구주제9: 신나는 게임 프로그램 만들기"}];const LINKS=[["정보과학 문제은행", "https://jsinsoo.github.io/is/bank/"], ["2차고사 준비 수행평가1", "https://jsinsoo.github.io/batang/onstar01.html"], ["2차고사 준비 수행평가2", "https://jsinsoo.github.io/batang/onstar02.html"], ["2차고사 준비 수행평가3", "https://jsinsoo.github.io/batang/onstar03.html"], ["2학기 정보과학 수행평가", "https://jsinsoo.github.io/is/su/"], ["상태 공간 탐색 핵심 용어 퀴즈", "https://forms.gle/foMNbwntoPEKi7fd9"], ["상태 공간 탐색 핵심 용어 평가", "https://forms.gle/4PM7q17Lgtr87s1d7"], ["디지털 윤리 수업지도안", "https://jsinsoo.github.io/de/"], ["스마트폰 과의존 예방교육", "https://jsinsoo.github.io/web/js_spe.html"]];const KEY='science-submission-2026-html-200';let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('links').innerHTML=LINKS.map(([t,u])=>`<a target="_blank" rel="noopener" href="${esc(u)}">★ ${esc(t)}</a>`).join('');$('sid').value=state.sid||'';$('sname').value=state.sname||'';
TASKS.forEach((t,i)=>{let el=document.createElement('article');el.className='task';el.innerHTML=`<h3>${esc(t.title)}</h3><div class="due">제출기한: ${esc(t.due)} · 배점 10점</div><div class="options">${[['10','제출 기일내 제출 (10점)'],['1','제출 기일후 제출 (1점)'],['0','미제출 (0점)']].map(([v,label])=>`<label><input type="radio" name="task${i}" value="${v}" ${state['t'+i]===v?'checked':''}> ${label}</label>`).join('')}</div>`;$(t.section==='주제발표'?'sectionA':'sectionB').appendChild(el);el.querySelectorAll('input').forEach(r=>r.addEventListener('change',()=>{state['t'+i]=r.value;persist()}))});
['sid','sname'].forEach(id=>$(id).addEventListener('input',()=>{state[id]=$(id).value;persist()}));function totals(){let a=0,b=0,done=0;TASKS.forEach((t,i)=>{let v=Number(state['t'+i]||0);if(state['t'+i]!==undefined)done++;if(t.section==='주제발표')a+=v;else b+=v});return {a,b,total:a+b,done}}function persist(){localStorage.setItem(KEY,JSON.stringify(state));update()}function update(){let {a,b,total,done}=totals();$('scoreA').textContent=a+' / 100';$('scoreB').textContent=b+' / 100';$('scoreT').textContent=total+' / 200';$('progress').textContent=`선택 완료: ${done} / 20문항`;$('fill').style.width=done/20*100+'%';[['tabId',state.sid||''],['tabName',state.sname||''],['tabA',a],['tabB',b],['tabT',total]].forEach(([id,v])=>$(id).textContent=v)}update();
function stamp(){return new Date().toLocaleString('sv-SE').replace(' ','_').replace(/:/g,'')}function fname(){return [(state.sid||'학번'),(state.sname||'이름')].map(x=>x.replace(/[^가-힣a-zA-Z0-9_-]/g,'')).join('_')}function download(content,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob(['﻿'+content],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function csv(s){return '"'+String(s).replace(/"/g,'""')+'"'}
function saveCSV(){let {a,b,total}=totals();let head=['학번','이름','주제발표 득점','프로그래밍 득점','전체 득점',...TASKS.map(t=>t.title)];let row=[state.sid||'',state.sname||'',a,b,total,...TASKS.map((_,i)=>state['t'+i]===undefined?'':Number(state['t'+i]))];download([head,row].map(r=>r.map(csv).join(',')).join('\n'),fname()+'_영역별득점_'+stamp()+'.csv','text/csv;charset=utf-8')}
function saveTXT(){let {a,b,total}=totals();let lines=['2026 정보과학 수행과제 제출확인','학번: '+(state.sid||''),'이름: '+(state.sname||''),`주제발표 영역: ${a}/100점`,`프로그래밍 영역: ${b}/100점`,`전체 득점: ${total}/200점`,''];TASKS.forEach((t,i)=>lines.push(`${t.title} | 제출기한 ${t.due} | ${state['t'+i]===undefined?'미선택':state['t'+i]==='10'?'제출 기일내 제출 (10점)':state['t'+i]==='1'?'제출 기일후 제출 (1점)':'미제출 (0점)'}`));download(lines.join('\n'),fname()+'_제출확인_'+stamp()+'.txt','text/plain;charset=utf-8')}
function resetAll(){if(confirm('학생 정보와 전체 선택을 초기화할까요?')){state={};localStorage.removeItem(KEY);location.reload()}}
</script></body></html>
