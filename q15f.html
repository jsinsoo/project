</div><section id="result" aria-live="polite"></section></main><script>
const qs=[{"num": 1, "title": "함수 정의와 호출", "id": "12정과01-01", "standard": "함수 정의와 호출의 원리를 이해하고, 매개변수를 활용한 함수 프로그램을 작성한다.", "method": "리스트 · 직접 인덱싱 · for 반복 인덱싱", "code": "보기 = [\n    '함수 정의 시 매개변수는 호출할 때 전달받을 값을 나타내는 이름이다.',\n    '함수의 매개변수는 함수 밖에서만 사용할 수 있으며 함수 내부에서는 접근할 수 없다.',\n    '함수는 정의하기만 하면 호출하지 않아도 본문이 자동으로 실행된다.',\n    'return 문은 함수의 실행을 중단하지 않고 다음 문장까지 반드시 실행한다.',\n    'print로 출력한 값은 항상 함수의 반환값이 된다.',\n]\n\ndef 선택(*번호):\n    for i in 번호:\n        print(보기[i])", "options": [[0], [0, 1, 3], [0, 1, 2, 3, 4], [0, 2], [1, 2, 3, 4]], "correct": 0, "truth": [0], "output": "함수 정의 시 매개변수는 호출할 때 전달받을 값을 나타내는 이름이다.", "verdict": "ㄱ. 옳음: 매개변수는 함수 내부에서 전달된 인수를 받아 사용하는 변수이다.\nㄴ. 틀림: 원래 옳았던 내용을 부정하거나 왜곡한 문장이다.\nㄷ. 틀림: def 문은 함수를 정의하며 일반적으로 호출해야 본문이 실행된다.\nㄹ. 틀림: 원래 옳았던 내용을 부정하거나 왜곡한 문장이다.\nㅁ. 틀림: print는 화면 출력이고 return은 반환이므로 서로 다르다.", "explanation": "옳은 설명의 번호는 (0)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 2, "title": "재귀 구조 활용", "id": "12정과01-02", "standard": "주어진 문제에서 적용할 수 있는 재귀관계를 파악하고, 재귀구조를 활용하여 프로그램을 작성한다.", "method": "딕셔너리 · 키 조회 · 딕셔너리 키 조회", "code": "보기 = dict(enumerate([\n    '재귀 함수는 직접 또는 간접적으로 자기 자신을 다시 호출할 수 있다.',\n    '재귀 함수에서는 종료 조건이 없어도 언제나 정상 종료한다.',\n    '팩토리얼은 n! = n × (n-1)! (n≥1)과 같은 재귀 관계로 나타낼 수 있다.',\n    '재귀호출에서 인수가 변하지 않아도 호출 깊이는 항상 감소한다.',\n    '기본 단계는 추가 재귀호출 없이 결과를 정하는 부분이다.',\n]))\n\ndef 선택(*번호):\n    for i in 번호:\n        print(보기[i])", "options": [[0, 2, 4], [1, 2, 3, 4], [2], [0, 1, 2, 3, 4], [0, 1]], "correct": 0, "truth": [0, 2, 4], "output": "재귀 함수는 직접 또는 간접적으로 자기 자신을 다시 호출할 수 있다.\n팩토리얼은 n! = n × (n-1)! (n≥1)과 같은 재귀 관계로 나타낼 수 있다.\n기본 단계는 추가 재귀호출 없이 결과를 정하는 부분이다.", "verdict": "ㄱ. 옳음: 자기 자신으로 되돌아오는 호출 관계가 재귀의 핵심이다.\nㄴ. 틀림: 종료 조건이 없거나 도달하지 못하면 무한 재귀 및 RecursionError가 발생할 수 있다.\nㄷ. 옳음: 더 작은 같은 종류의 문제와 현재 단계의 연산을 결합한다.\nㄹ. 틀림: 인수가 줄거나 종료 조건에 접근한다는 보장이 없다.\nㅁ. 옳음: 기본 단계가 재귀의 종료를 가능하게 한다.", "explanation": "옳은 설명의 번호는 (0, 2, 4)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 3, "title": "스택과 큐 구현", "id": "12정과02-01", "standard": "스택과 큐의 원리를 이해하고, 순차적인 데이터 구조를 이용하여 스택과 큐를 구현한다.", "method": "튜플 · 인덱싱 · 제너레이터 표현식", "code": "보기 = tuple([\n    '파이썬 리스트의 append(x)는 리스트의 맨 끝에 x를 추가한다.',\n    '스택은 후입선출(LIFO) 방식으로 동작한다.',\n    '큐는 선입선출(FIFO) 방식으로 동작한다.',\n    '파이썬 리스트의 append(x)는 원소 x를 리스트의 맨 끝에 추가한다.',\n    '리스트를 이용한 큐에서 append와 pop(0)을 조합하면 FIFO를 구현할 수 있다.',\n])\n\ndef 선택(*번호):\n    print(*(보기[i] for i in 번호), sep=\"\\n\")", "options": [[0, 3], [0, 1, 2, 3, 4], [0, 1, 2], [0, 2, 3, 4], [2]], "correct": 1, "truth": [0, 1, 2, 3, 4], "output": "파이썬 리스트의 append(x)는 리스트의 맨 끝에 x를 추가한다.\n스택은 후입선출(LIFO) 방식으로 동작한다.\n큐는 선입선출(FIFO) 방식으로 동작한다.\n파이썬 리스트의 append(x)는 원소 x를 리스트의 맨 끝에 추가한다.\n리스트를 이용한 큐에서 append와 pop(0)을 조합하면 FIFO를 구현할 수 있다.", "verdict": "ㄱ. 옳음: 기존의 잘못된 설명을 올바르게 고친 문장이다.\nㄴ. 옳음: 가장 나중에 들어온 데이터가 먼저 나온다.\nㄷ. 옳음: 가장 먼저 들어온 데이터가 먼저 나온다.\nㄹ. 옳음: 잘못된 설명을 정확한 개념으로 고쳤으며, 파이썬 리스트의 append(x)는 원소 x를 리스트의 맨 끝에 추가한다.\nㅁ. 옳음: 뒤에 넣고 앞에서 빼면 FIFO가 되지만 pop(0)은 이동 비용이 있다.", "explanation": "옳은 설명의 번호는 (0, 1, 2, 3, 4)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 4, "title": "스택과 큐 활용", "id": "12정과02-02", "standard": "스택, 큐를 활용하여 문제를 효율적으로 해결하는 프로그램을 작성한다.", "method": "집합(set) · 정렬된 키 · 정렬 및 lambda", "code": "원본 = [\n    '브라우저의 뒤로 가기 기록은 스택으로 모델링할 수 있다.',\n    '인쇄 작업 대기열은 일반적으로 큐로 모델링할 수 있다.',\n    'BFS의 탐색 대기열은 원칙적으로 스택을 사용해야 레벨 순서가 유지된다.',\n    '브라우저의 뒤로 가기 기록은 스택 구조와 전혀 관계가 없다.',\n    '큐에서 dequeue는 반드시 가장 나중에 들어온 원소를 꺼낸다.',\n]\n보기 = {(i, 문장) for i, 문장 in enumerate(원본)}\n\ndef 선택(*번호):\n    정렬 = sorted(보기, key=lambda x: x[0])\n    for i in 번호:\n        print(정렬[i][1])", "options": [[0, 1, 2, 3, 4], [0, 1, 3], [0, 1], [1, 2, 3, 4], [3]], "correct": 2, "truth": [0, 1], "output": "브라우저의 뒤로 가기 기록은 스택으로 모델링할 수 있다.\n인쇄 작업 대기열은 일반적으로 큐로 모델링할 수 있다.", "verdict": "ㄱ. 옳음: 가장 최근 방문 이전 페이지를 먼저 복원한다.\nㄴ. 옳음: 먼저 접수된 작업부터 처리하는 FIFO가 적합하다.\nㄷ. 틀림: BFS는 큐를 사용하여 가까운 정점부터 탐색한다.\nㄹ. 틀림: 원래 옳았던 내용을 부정하거나 왜곡한 문장이다.\nㅁ. 틀림: 큐는 가장 먼저 들어온 원소를 꺼낸다.", "explanation": "옳은 설명의 번호는 (0, 1)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 5, "title": "트리와 그래프 구현", "id": "12정과02-03", "standard": "트리와 그래프의 원리를 이해하고, 인접행렬과 인접리스트로 트리, 그래프를 구현한다.", "method": "리스트 · 슬라이싱 · 슬라이싱", "code": "보기 = [\n    '인접 행렬은 정점 쌍 사이의 연결 여부를 2차원 배열로 표현할 수 있다.',\n    '무방향 그래프의 인접 행렬은 일반적으로 대칭이다.',\n    '인접 리스트는 각 정점에 인접한 정점들을 목록으로 저장한다.',\n    '모든 트리는 반드시 사이클을 하나 이상 포함한다.',\n    '간선이 적은 희소 그래프에서는 인접 리스트가 공간상 유리할 수 있다.',\n]\n\ndef 선택(*번호):\n    for i in 번호:\n        print(보기[i:i+1][0])", "options": [[0, 1, 2, 3, 4], [0, 1, 3], [1, 4], [0, 1, 2, 4], [0]], "correct": 3, "truth": [0, 1, 2, 4], "output": "인접 행렬은 정점 쌍 사이의 연결 여부를 2차원 배열로 표현할 수 있다.\n무방향 그래프의 인접 행렬은 일반적으로 대칭이다.\n인접 리스트는 각 정점에 인접한 정점들을 목록으로 저장한다.\n간선이 적은 희소 그래프에서는 인접 리스트가 공간상 유리할 수 있다.", "verdict": "ㄱ. 옳음: 행과 열이 정점에 대응하고 원소가 간선 정보를 담는다.\nㄴ. 옳음: 기존의 잘못된 설명을 올바르게 고친 문장이다.\nㄷ. 옳음: 정점별 이웃 정보를 기록한다.\nㄹ. 틀림: 트리는 연결되어 있고 사이클이 없는 그래프이다.\nㅁ. 옳음: 일반적인 인접 리스트는 O(V+E), 행렬은 O(V²) 공간을 사용한다.", "explanation": "옳은 설명의 번호는 (0, 1, 2, 4)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 6, "title": "트리와 그래프 활용", "id": "12정과02-04", "standard": "트리, 그래프를 활용하여 문제를 효율적으로 해결하는 프로그램을 작성한다.", "method": "딕셔너리 · map · map()과 get()", "code": "보기 = {i: 문장 for i, 문장 in enumerate([\n    '그래프에 사이클이 있으면 중복 방문을 막기 위한 방문 처리가 유용하다.',\n    'BFS는 큐를 이용해 시작 정점에서 가까운 단계부터 탐색한다.',\n    'DFS는 스택이나 재귀호출을 이용해 깊은 경로를 먼저 탐색할 수 있다.',\n    '그래프 탐색에서 방문 처리는 언제나 불필요하다.',\n    '무가중치 그래프의 BFS는 최소 간선 수 경로를 찾는 데 활용할 수 있다.',\n])}\n\ndef 선택(*번호):\n    print(*map(보기.get, 번호), sep=\"\\n\")", "options": [[0, 1, 2, 3, 4], [0, 1, 3], [0, 1, 2, 4], [3], [0, 4]], "correct": 2, "truth": [0, 1, 2, 4], "output": "그래프에 사이클이 있으면 중복 방문을 막기 위한 방문 처리가 유용하다.\nBFS는 큐를 이용해 시작 정점에서 가까운 단계부터 탐색한다.\nDFS는 스택이나 재귀호출을 이용해 깊은 경로를 먼저 탐색할 수 있다.\n무가중치 그래프의 BFS는 최소 간선 수 경로를 찾는 데 활용할 수 있다.", "verdict": "ㄱ. 옳음: 기존의 잘못된 설명을 올바르게 고친 문장이다.\nㄴ. 옳음: 큐를 통해 발견 순서대로 정점을 처리한다.\nㄷ. 옳음: 재귀호출은 호출 스택을 활용한다.\nㄹ. 틀림: 사이클이 있으면 중복 방문이나 무한 반복을 방지해야 한다.\nㅁ. 옳음: 단계별 탐색이므로 최초 도달 단계가 최소 간선 수이다.", "explanation": "옳은 설명의 번호는 (0, 1, 2, 4)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 7, "title": "상태 공간 전체 탐색", "id": "12정과03-01", "standard": "문제를 분석하여 상태 공간으로 구조화하고, 상태 공간을 모두 탐색하여 문제를 해결하는 알고리즘을 설계한다.", "method": "리스트 · 컴프리헨션 · 리스트 컴프리헨션", "code": "보기 = [\n    '상태 공간은 문제 해결 중 가능한 상태들의 집합으로 모델링할 수 있다.',\n    '전체 탐색은 정답 후보를 단 하나만 검사하는 방법이다.',\n    '상태 공간에는 가능한 상태를 표현할 수 없다.',\n    '완전 탐색은 입력 크기가 커져도 계산량이 절대로 증가하지 않는다.',\n    '상태 공간 탐색에서는 가능한 선택을 트리로 나타낼 수 없다.',\n]\n\ndef 선택(*번호):\n    결과 = [보기[i] for i in 번호]\n    print(\"\\n\".join(결과))", "options": [[0, 1, 2, 3], [0, 2, 4], [1, 2], [0], [0, 1, 2, 3, 4]], "correct": 3, "truth": [0], "output": "상태 공간은 문제 해결 중 가능한 상태들의 집합으로 모델링할 수 있다.", "verdict": "ㄱ. 옳음: 초기 상태와 전이 가능한 상태를 정의한다.\nㄴ. 틀림: 전체 탐색은 정의된 후보 공간을 빠짐없이 조사하는 방식이다.\nㄷ. 틀림: 원래 옳았던 내용을 부정하거나 왜곡한 문장이다.\nㄹ. 틀림: 후보 수가 증가하면 계산량이 크게 늘 수 있다.\nㅁ. 틀림: 원래 옳았던 내용을 부정하거나 왜곡한 문장이다.", "explanation": "옳은 설명의 번호는 (0)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 8, "title": "탐색 공간 배제", "id": "12정과03-02", "standard": "문제의 상태 공간 일부를 배제하는 알고리즘을 설계하고, 기존의 탐색기반 알고리즘과 비교·분석한다.", "method": "튜플 · itemgetter · operator.itemgetter", "code": "from operator import itemgetter\n보기 = tuple([\n    '이진 탐색은 정렬 여부와 관계없이 임의의 리스트에서 항상 정확하다.',\n    '이진 탐색은 중간값과 목표값의 비교 결과에 따라 탐색 구간을 줄인다.',\n    '가지치기는 해가 될 수 없다고 판단한 상태의 하위 탐색을 생략한다.',\n    '탐색 공간을 많이 배제할수록 정답을 누락해도 알고리즘은 항상 올바르다.',\n    '동일한 정렬 자료에서 이진 탐색은 일반적으로 선형 탐색보다 비교 횟수 증가가 느리다.',\n])\n\ndef 선택(*번호):\n    from operator import itemgetter\n    print(*itemgetter(*번호)(보기), sep=\"\\n\") if len(번호)>1 else print(보기[번호[0]])", "options": [[0], [1, 2], [1, 2, 3, 4], [1, 2, 4], [0, 1, 2, 3, 4]], "correct": 3, "truth": [1, 2, 4], "output": "이진 탐색은 중간값과 목표값의 비교 결과에 따라 탐색 구간을 줄인다.\n가지치기는 해가 될 수 없다고 판단한 상태의 하위 탐색을 생략한다.\n동일한 정렬 자료에서 이진 탐색은 일반적으로 선형 탐색보다 비교 횟수 증가가 느리다.", "verdict": "ㄱ. 틀림: 일반적인 이진 탐색에는 정렬 또는 단조성이 필요하다.\nㄴ. 옳음: 조건에 따라 절반 구간을 배제한다.\nㄷ. 옳음: 배제의 타당성이 정답 보존의 핵심이다.\nㄹ. 틀림: 정답 가능성이 있는 상태를 배제하면 정확성을 잃는다.\nㅁ. 옳음: 이진 탐색은 O(log n), 선형 탐색은 O(n)이다.", "explanation": "옳은 설명의 번호는 (1, 2, 4)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 9, "title": "부분 문제 관계 발견", "id": "12정과03-03", "standard": "전체 문제를 부분 문제로 분해하고, 전체 문제와 부분 문제의 관계를 발견한다.", "method": "딕셔너리 · items와 필터 · 딕셔너리 컴프리헨션", "code": "보기 = dict(enumerate([\n    '1부터 n까지의 합 S(n)은 S(n-1)+n으로 표현할 수 있다.',\n    '피보나치 수열의 재귀 계산에서는 같은 부분 문제가 중복될 수 있다.',\n    '계단 오르기 문제는 이동 규칙에 따라 작은 계단 수의 해와 관계식을 세울 수 있다.',\n    '피보나치 수열의 단순 재귀 계산에서는 같은 부분 문제가 중복될 수 있다.',\n    '전체 문제와 부분 문제 사이의 관계를 식으로 나타내면 알고리즘 설계에 도움이 된다.',\n]))\n\ndef 선택(*번호):\n    결과 = {i: 보기[i] for i in 번호}\n    print(*결과.values(), sep=\"\\n\")", "options": [[1, 2], [0, 2, 3, 4], [0, 1, 2, 3, 4], [2], [0, 1, 4]], "correct": 2, "truth": [0, 1, 2, 3, 4], "output": "1부터 n까지의 합 S(n)은 S(n-1)+n으로 표현할 수 있다.\n피보나치 수열의 재귀 계산에서는 같은 부분 문제가 중복될 수 있다.\n계단 오르기 문제는 이동 규칙에 따라 작은 계단 수의 해와 관계식을 세울 수 있다.\n피보나치 수열의 단순 재귀 계산에서는 같은 부분 문제가 중복될 수 있다.\n전체 문제와 부분 문제 사이의 관계를 식으로 나타내면 알고리즘 설계에 도움이 된다.", "verdict": "ㄱ. 옳음: 마지막 항 n과 앞의 합으로 분해한다.\nㄴ. 옳음: 기존의 잘못된 설명을 올바르게 고친 문장이다.\nㄷ. 옳음: 한 칸 또는 두 칸 이동이면 일반적으로 f(n)=f(n-1)+f(n-2)이다.\nㄹ. 옳음: 잘못된 설명을 정확한 개념으로 고쳤으며, 피보나치 수열의 단순 재귀 계산에서는 같은 부분 문제가 중복될 수 있다.\nㅁ. 옳음: 점화식은 계산의 의존 관계를 드러낸다.", "explanation": "옳은 설명의 번호는 (0, 1, 2, 3, 4)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 10, "title": "분할 정복 알고리즘", "id": "12정과03-04", "standard": "부분 문제를 해결한 결과를 이용하여 전체 문제를 해결하는 관계기반 알고리즘을 설계한다.", "method": "리스트 · zip · zip()", "code": "보기 = [\n    '분할 정복은 문제를 작은 부분 문제로 나누고 해결 결과를 결합한다.',\n    '퀵 정렬은 피벗을 사용하지 않고 반드시 인접한 두 원소만 교환한다.',\n    '병합 정렬은 분할한 정렬 결과를 병합하여 전체를 정렬한다.',\n    '분할 정복 알고리즘에는 종료할 수 있는 기본 조건이 전혀 필요 없다.',\n    '분할 정복은 문제를 더 작은 부분 문제로 나누지 않는다.',\n]\n번호표 = dict(zip(range(len(보기)), 보기))\n\ndef 선택(*번호):\n    번호표 = dict(zip(range(len(보기)), 보기))\n    print(*(번호표[i] for i in 번호), sep=\"\\n\")", "options": [[0, 1, 2], [0, 1, 3, 4], [0], [0, 1, 2, 3, 4], [0, 2]], "correct": 4, "truth": [0, 2], "output": "분할 정복은 문제를 작은 부분 문제로 나누고 해결 결과를 결합한다.\n병합 정렬은 분할한 정렬 결과를 병합하여 전체를 정렬한다.", "verdict": "ㄱ. 옳음: 분할·정복·결합 구조가 핵심이다.\nㄴ. 틀림: 퀵 정렬은 피벗을 기준으로 분할한다.\nㄷ. 옳음: 정렬된 두 부분 배열을 합치는 병합 단계가 있다.\nㄹ. 틀림: 재귀적 분할에서는 기본 조건이 필요하다.\nㅁ. 틀림: 원래 옳았던 내용을 부정하거나 왜곡한 문장이다.", "explanation": "옳은 설명의 번호는 (0, 2)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 11, "title": "동적 계획법 알고리즘", "id": "12정과03-05", "standard": "부분 문제가 중복으로 적용되지 않는 알고리즘을 설계하고 기존의 관계기반 알고리즘과 비교·분석한다.", "method": "집합(set) · 번호와 문장 쌍 · 집합과 dict()", "code": "원본 = [\n    '동적 계획법은 이미 구한 부분 문제 결과를 반드시 버리고 다시 계산한다.',\n    '메모이제이션은 계산한 결과를 저장하여 같은 인수의 재계산을 줄인다.',\n    '타뷸레이션은 작은 부분 문제부터 표를 채워 큰 문제를 해결할 수 있다.',\n    '동적 계획법을 사용하면 모든 문제의 시간 복잡도가 반드시 O(1)이 된다.',\n    '동적 계획법을 적용할 때 부분 문제 사이의 의존 관계를 파악해야 한다.',\n]\n보기 = {(i, 문장) for i, 문장 in enumerate(원본)}\n\ndef 선택(*번호):\n    사전 = dict(보기)\n    print(\"\\n\".join(map(사전.__getitem__, 번호)))", "options": [[2, 4], [0, 1, 2, 3, 4], [1, 2, 3, 4], [0], [1, 2, 4]], "correct": 4, "truth": [1, 2, 4], "output": "메모이제이션은 계산한 결과를 저장하여 같은 인수의 재계산을 줄인다.\n타뷸레이션은 작은 부분 문제부터 표를 채워 큰 문제를 해결할 수 있다.\n동적 계획법을 적용할 때 부분 문제 사이의 의존 관계를 파악해야 한다.", "verdict": "ㄱ. 틀림: 결과를 저장하고 재사용하여 중복 계산을 줄인다.\nㄴ. 옳음: 하향식 DP에 자주 쓰이는 저장 방식이다.\nㄷ. 옳음: 상향식 DP의 대표적인 방법이다.\nㄹ. 틀림: 상태 수와 상태 전이 계산량에 따라 복잡도가 달라진다.\nㅁ. 옳음: 점화식과 계산 순서가 설계의 기초이다.", "explanation": "옳은 설명의 번호는 (1, 2, 4)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 12, "title": "알고리즘 복잡도 비교", "id": "12정과03-06", "standard": "알고리즘의 복잡도를 빅오 표기법으로 표현하고 다른 알고리즘과 비교한다.", "method": "튜플 · 슬라이싱과 연결 · 튜플 슬라이싱", "code": "보기 = tuple([\n    'O(n)은 입력 크기 n에 비례하는 증가율의 상한을 나타내는 데 쓰인다.',\n    '빅오 표기법은 실제 실행 시간을 초 단위로 정확히 나타내는 방식이 아니다.',\n    '두 겹의 반복문이 각각 n번 실행되면 본문 실행 횟수는 n²번이다.',\n    '빅오 표기법은 실행 시간을 정확한 초 단위로 나타내지는 않는다.',\n    '1부터 n까지의 합을 공식 n(n+1)//2로 계산하면 기본 산술 연산 횟수는 일정하다.',\n])\n\ndef 선택(*번호):\n    결과 = tuple(보기[i:i+1][0] for i in 번호)\n    print(*결과, sep=\"\\n\")", "options": [[0, 1, 2, 3, 4], [0, 2, 3, 4], [0, 1], [0, 1, 2], [2]], "correct": 0, "truth": [0, 1, 2, 3, 4], "output": "O(n)은 입력 크기 n에 비례하는 증가율의 상한을 나타내는 데 쓰인다.\n빅오 표기법은 실제 실행 시간을 초 단위로 정확히 나타내는 방식이 아니다.\n두 겹의 반복문이 각각 n번 실행되면 본문 실행 횟수는 n²번이다.\n빅오 표기법은 실행 시간을 정확한 초 단위로 나타내지는 않는다.\n1부터 n까지의 합을 공식 n(n+1)//2로 계산하면 기본 산술 연산 횟수는 일정하다.", "verdict": "ㄱ. 옳음: 빅오는 점근적 상한을 표현한다.\nㄴ. 옳음: 기존의 잘못된 설명을 올바르게 고친 문장이다.\nㄷ. 옳음: 독립된 중첩 반복이면 n×n회이다.\nㄹ. 옳음: 잘못된 설명을 정확한 개념으로 고쳤으며, 빅오 표기법은 실행 시간을 정확한 초 단위로 나타내지는 않는다.\nㅁ. 옳음: 고정 크기 정수 연산 모델에서는 O(1)로 분석한다.", "explanation": "옳은 설명의 번호는 (0, 1, 2, 3, 4)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 13, "title": "실생활 문제 발견", "id": "12정과04-01", "standard": "다양한 학문 분야에서 컴퓨터과학의 기본 개념과 원리를 바탕으로 해결할 수 있는 실생활의 문제를 발견한다.", "method": "리스트 · enumerate와 조건식 · enumerate()와 next()", "code": "보기 = [\n    '실생활 문제를 정의할 때 사용자와 불편 상황을 구체화하면 도움이 된다.',\n    '컴퓨터과학 프로젝트에서는 입력 데이터가 무엇인지 검토할 필요가 없다.',\n    '교실 전력 절약 문제는 사용 시간과 소비 전력 데이터를 활용해 분석할 수 있다.',\n    '문제 발견 단계에서는 해결 목표와 제한 조건을 고려하면 안 된다.',\n    '실생활 문제를 정의할 때 사용자와 불편 상황을 구체화할 필요가 전혀 없다.',\n]\n\ndef 선택(*번호):\n    for k in 번호:\n        print(next(문장 for i, 문장 in enumerate(보기) if i == k))", "options": [[0, 2], [4], [0, 2, 4], [0, 1, 2, 3, 4], [0, 1, 2, 3]], "correct": 0, "truth": [0, 2], "output": "실생활 문제를 정의할 때 사용자와 불편 상황을 구체화하면 도움이 된다.\n교실 전력 절약 문제는 사용 시간과 소비 전력 데이터를 활용해 분석할 수 있다.", "verdict": "ㄱ. 옳음: 문제의 대상과 맥락을 분명히 한다.\nㄴ. 틀림: 데이터의 수집 가능성과 품질을 검토해야 한다.\nㄷ. 옳음: 측정 가능한 자료가 문제 해결의 근거가 된다.\nㄹ. 틀림: 실현 가능성을 판단하려면 목표와 제약을 고려해야 한다.\nㅁ. 틀림: 원래 옳았던 내용을 부정하거나 왜곡한 문장이다.", "explanation": "옳은 설명의 번호는 (0, 2)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 14, "title": "프로젝트 수행 과정 설계", "id": "12정과04-02", "standard": "발견한 문제를 분석하고, 문제를 해결하기 위한 프로젝트 수행 과정을 설계한다.", "method": "딕셔너리 · lambda와 map · lambda와 map()", "code": "보기 = dict(enumerate([\n    '프로젝트 계획은 구현 전에 목표와 수행 과정을 정리하는 데 도움이 된다.',\n    '프로젝트 설계에는 입력·출력과 제약 조건을 정의하는 과정이 포함될 수 있다.',\n    '역할 분담과 일정 및 산출물을 정하면 협업 계획을 구체화할 수 있다.',\n    '테스트 기준은 프로그램이 완성된 뒤에도 전혀 필요하지 않다.',\n    '문제 정의부터 데이터 수집·알고리즘 설계·구현·검증까지의 흐름을 계획할 수 있다.',\n]))\n\ndef 선택(*번호):\n    읽기 = lambda i: 보기[i]\n    print(*map(읽기, 번호), sep=\"\\n\")", "options": [[0], [0, 1, 3], [0, 1, 2, 3, 4], [0, 1, 2, 4], [0, 2]], "correct": 3, "truth": [0, 1, 2, 4], "output": "프로젝트 계획은 구현 전에 목표와 수행 과정을 정리하는 데 도움이 된다.\n프로젝트 설계에는 입력·출력과 제약 조건을 정의하는 과정이 포함될 수 있다.\n역할 분담과 일정 및 산출물을 정하면 협업 계획을 구체화할 수 있다.\n문제 정의부터 데이터 수집·알고리즘 설계·구현·검증까지의 흐름을 계획할 수 있다.", "verdict": "ㄱ. 옳음: 기존의 잘못된 설명을 올바르게 고친 문장이다.\nㄴ. 옳음: 요구 분석을 통해 해결 범위를 명확히 한다.\nㄷ. 옳음: 담당자와 마감·결과물을 연결한다.\nㄹ. 틀림: 검증 기준은 결과의 적합성을 판단하는 데 필요하다.\nㅁ. 옳음: 단계별 의존 관계를 고려한 수행 계획이다.", "explanation": "옳은 설명의 번호는 (0, 1, 2, 4)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}, {"num": 15, "title": "오픈소스와 라이브러리 활용 협력 프로젝트", "id": "12정과04-03", "standard": "다양한 오픈소스 및 라이브러리를 활용하여 협력적으로 문제를 해결하기 위한 프로그램을 작성한다.", "method": "리스트 · 재귀와 인덱싱 · 재귀 함수", "code": "보기 = [\n    '파이썬 statistics는 평균과 중앙값 계산 등에 사용할 수 있는 표준 라이브러리이다.',\n    '오픈소스는 출처나 라이선스 조건을 확인하지 않고 언제나 제한 없이 재배포할 수 있다.',\n    '파이썬 statistics 모듈은 평균이나 중앙값을 계산하는 기능을 제공하지 않는다.',\n    '외부 라이브러리는 모두 파이썬 설치만으로 자동 포함되며 별도 설치가 절대 필요 없다.',\n    '협력 프로젝트에서는 함수의 입력과 출력 인터페이스를 합의할 필요가 없다.',\n]\n\ndef 선택(*번호):\n    def 출력(k):\n        if k == len(번호):\n            return\n        print(보기[번호[k]])\n        출력(k + 1)\n    출력(0)", "options": [[0, 4], [0], [0, 1, 4], [0, 1, 2, 3, 4], [0, 1, 3, 4]], "correct": 1, "truth": [0], "output": "파이썬 statistics는 평균과 중앙값 계산 등에 사용할 수 있는 표준 라이브러리이다.", "verdict": "ㄱ. 옳음: statistics.mean과 median 등을 제공한다.\nㄴ. 틀림: 라이선스에 따라 고지·배포 조건 등이 다르다.\nㄷ. 틀림: 원래 옳았던 내용을 부정하거나 왜곡한 문장이다.\nㄹ. 틀림: 외부 라이브러리는 별도 설치가 필요한 경우가 많다.\nㅁ. 틀림: 원래 옳았던 내용을 부정하거나 왜곡한 문장이다.", "explanation": "옳은 설명의 번호는 (0)이다. 선택(*번호)는 전달받은 번호에 해당하는 설명을 순서대로 출력한다. 나머지 선택지는 옳은 설명을 누락하거나 틀린 설명을 포함하므로 정답이 아니다."}];
const symbols=['①','②','③','④','⑤'];const $=id=>document.getElementById(id);const root=$('questions');
const fmt=a=>'('+a.join(', ')+')';
qs.forEach((q,i)=>{const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=q.num+'. '+q.title+' ['+q.id+']';const p=document.createElement('p');p.className='meta';p.textContent='성취기준: '+q.standard+' | '+q.method;const stem=document.createElement('p');stem.className='stem';stem.textContent='다음 파이썬 코드에서 옳은 설명만 원래 순서대로 출력하려고 한다. 옳은 것을 있는 대로 모두 고르시오.';const pre=document.createElement('pre');pre.textContent=q.code+'\n\n# 선택(*번호)';card.append(h,p,stem,pre);q.options.forEach((opt,j)=>{const label=document.createElement('label');label.className='choice';const radio=document.createElement('input');radio.type='radio';radio.name='q'+i;radio.value=j;radio.addEventListener('change',update);const span=document.createElement('span');span.textContent=symbols[j]+' '+fmt(opt);label.append(radio,span);card.append(label)});root.append(card)});
function answers(){return qs.map((_,i)=>{const e=document.querySelector('input[name="q'+i+'"]:checked');return e?Number(e.value):null})}
function update(){$('progress').textContent='응답 '+answers().filter(x=>x!==null).length+' / '+qs.length+'문항'}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds())}
function safe(s){return s.trim().replace(/[\/:*?"<>|\x00-\x1f]/g,'_').replace(/\s+/g,'_').slice(0,40)}
$('submit').addEventListener('click',()=>{const no=$('studentNo').value.trim(),name=$('studentName').value.trim();if(!no||!name){alert('학번과 이름을 입력하세요.');return}const a=answers();if(a.some(x=>x===null)){alert('모든 문항에 답한 후 제출하세요.');return}const score=qs.reduce((s,q,i)=>s+(a[i]===q.correct?1:0),0);const t=stamp();const lines=['2026 정보과학 F형 성취기준 평가','학번: '+no,'이름: '+name,'점수: '+score+' / 15점','응시시각: '+t,'='.repeat(72)];const result=$('result');result.replaceChildren();result.style.display='block';const h=document.createElement('h2');h.textContent='채점 결과: '+score+' / 15점';result.append(h);qs.forEach((q,i)=>{const ok=a[i]===q.correct;const detail=[q.num+'. '+q.title+' ['+q.id+']','성취기준: '+q.standard,'채점: '+(ok?'정답':'오답'),'학생 답안: '+symbols[a[i]]+' '+fmt(q.options[a[i]]),'정답: '+symbols[q.correct]+' '+fmt(q.truth),'[문항 발문] 옳은 것을 있는 대로 모두 고르시오.','[파이썬 코드]',q.code,'[출력 결과]',q.output,'[각 설명의 정오 판단]',q.verdict,'[상세 해설]',q.explanation].join('\n');lines.push('',detail,'-'.repeat(72));const pre=document.createElement('pre');pre.className='result';pre.textContent=detail;result.append(pre)});const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=safe(no)+'_'+safe(name)+'_'+score+'점_성취기준_'+t+'.txt';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);document.querySelectorAll('input[type=radio]').forEach(e=>e.disabled=true);$('submit').disabled=true;result.scrollIntoView({behavior:'smooth'})});$('reset').addEventListener('click',()=>{if(confirm('답안을 초기화하시겠습니까?'))location.reload()});
</script></body></html>
