<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>정보과학 과세특 마무리 멘트 60개</title><style>body{font-family:"Malgun Gothic","Noto Sans KR",sans-serif;background:#f4f7fb;color:#17263b;margin:0}header{background:#16385f;color:white;padding:32px max(20px,calc((100% - 1100px)/2))}h1{font-size:26px;margin:0 0 12px}header p{line-height:1.7;margin:0}.wrap{max-width:1100px;margin:auto;padding:22px}.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}.tools button,.tools input{font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:11px 15px;background:white}.tools button{cursor:pointer}.tools button.active{background:#16385f;color:white}.tools input{flex:1;min-width:190px}.stats{margin-bottom:14px;color:#475569}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{background:white;border:1px solid #e1e8f0;border-radius:12px;padding:18px;box-shadow:0 2px 7px #152d4410}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.tag{font-size:13px;font-weight:bold;padding:5px 9px;border-radius:6px;background:#e7efff;color:#174184}.tag.upper{background:#e5f5ef;color:#17694b}.tag.normal{background:#f4efe3;color:#7a5717}.sentence{line-height:1.85;min-height:90px;word-break:keep-all}.copy{border:1px solid #a7b8ce;background:#f8fafc;border-radius:7px;padding:7px 13px;cursor:pointer}.foot{margin-top:25px;color:#5d6b7d;font-size:13px;line-height:1.7}@media print{header{background:white;color:black;padding:12px}.tools,.copy{display:none}.cards{display:block}.card{break-inside:avoid;box-shadow:none;margin-bottom:8px}.sentence{min-height:0}}</style></head><body><header><h1>2026 고등학교 정보과학 과세특 마무리 멘트 60개</h1><p>최상위 · 상위 · 보통 각 20개 | 서로 다른 교사 관찰형 종결 표현<br>제시된 3개 예시 문장을 제외한 새로운 60개 문장입니다.</p></header><main class="wrap"><div class="tools"><button data-filter="전체" class="active">전체 60개</button><button data-filter="최상위">최상위 20개</button><button data-filter="상위">상위 20개</button><button data-filter="보통">보통 20개</button><input id="search" placeholder="문장 내용 검색" aria-label="문장 검색"><button onclick="window.print()">인쇄 / PDF</button><button id="copyAll">현재 목록 전체 복사</button></div><div class="stats" id="stats"></div><div class="cards" id="cards"></div><p class="foot">※ 실제 학생의 활동과 성취 근거에 부합하는 문장을 선택하고 필요에 따라 수정하여 사용하세요. 최상위·상위·보통은 문장 선택을 위한 편의 분류입니다.</p></main><script>const items=[{"level": "최상위", "n": 1, "text": "복합적인 문제 상황에서도 핵심 원리를 통찰하고 독창적인 해결 방향을 제시하는 역량이 돋보임."}, {"level": "최상위", "n": 2, "text": "탐구 과정에서 얻은 근거를 정교하게 연결하여 새로운 관점으로 확장하는 사고력이 탁월함."}, {"level": "최상위", "n": 3, "text": "알고리즘의 정확성과 효율성을 함께 고려하며 최적의 해결책을 주도적으로 도출함."}, {"level": "최상위", "n": 4, "text": "예상하지 못한 오류를 학습의 기회로 삼아 해결 과정을 체계적으로 고도화함."}, {"level": "최상위", "n": 5, "text": "자료의 특성과 제약 조건을 면밀히 검토하여 설계의 완성도를 높이는 역량이 뛰어남."}, {"level": "최상위", "n": 6, "text": "다양한 접근 방법의 장단점을 비판적으로 비교하고 선택의 타당성을 설득력 있게 입증함."}, {"level": "최상위", "n": 7, "text": "이론적 개념을 실제 문제에 창의적으로 적용하며 학습의 깊이와 폭을 확장함."}, {"level": "최상위", "n": 8, "text": "문제 해결의 전 과정을 스스로 점검하고 개선하며 높은 수준의 자기주도성을 발휘함."}, {"level": "최상위", "n": 9, "text": "실험 결과를 객관적으로 해석하고 추가 검증을 통해 결론의 신뢰성을 높임."}, {"level": "최상위", "n": 10, "text": "자료구조와 알고리즘의 관계를 깊이 이해하고 상황에 맞는 전략을 유연하게 설계함."}, {"level": "최상위", "n": 11, "text": "추상적인 개념을 명료한 모델로 구체화하여 복잡한 문제의 구조를 정확하게 설명함."}, {"level": "최상위", "n": 12, "text": "탐구 결과의 한계를 스스로 찾아내고 후속 과제를 제안하는 학문적 성숙도가 돋보임."}, {"level": "최상위", "n": 13, "text": "여러 교과의 지식을 유기적으로 연결하여 정보과학의 활용 가능성을 새롭게 탐색함."}, {"level": "최상위", "n": 14, "text": "논리적 추론과 실증적 검증을 균형 있게 활용하여 해결 과정의 설득력을 높임."}, {"level": "최상위", "n": 15, "text": "기존 구현 방식에 안주하지 않고 더 간결하고 효율적인 구조를 지속적으로 탐색함."}, {"level": "최상위", "n": 16, "text": "협업 과정에서 다양한 의견을 통합하고 공동의 문제 해결을 이끄는 리더십을 발휘함."}, {"level": "최상위", "n": 17, "text": "기술의 사회적 영향을 다각도로 검토하며 책임 있는 활용 방안을 구체적으로 제시함."}, {"level": "최상위", "n": 18, "text": "복잡한 실행 과정을 단계별로 분석하고 결과를 명확하게 설명하는 표현력이 뛰어남."}, {"level": "최상위", "n": 19, "text": "실패 사례까지 분석 자료로 활용하여 해결 전략을 정교하게 발전시키는 태도가 인상적임."}, {"level": "최상위", "n": 20, "text": "스스로 설정한 높은 탐구 목표를 끝까지 실현하며 정보과학적 역량의 우수성을 입증함."}, {"level": "상위", "n": 1, "text": "핵심 개념을 정확히 이해하고 이를 다양한 문제 상황에 적절하게 적용하는 능력을 보임."}, {"level": "상위", "n": 2, "text": "주어진 조건을 꼼꼼히 분석하여 합리적인 해결 절차를 구성하는 역량이 우수함."}, {"level": "상위", "n": 3, "text": "알고리즘의 작동 원리를 논리적으로 설명하고 구현 결과를 충실하게 검증함."}, {"level": "상위", "n": 4, "text": "탐구 과정에서 발견한 문제점을 스스로 수정하며 결과물의 완성도를 높임."}, {"level": "상위", "n": 5, "text": "학습한 개념을 실제 사례와 연결하여 활용 방법을 구체적으로 제시함."}, {"level": "상위", "n": 6, "text": "여러 해결 방법을 비교하고 문제의 특성에 알맞은 접근 방식을 선택함."}, {"level": "상위", "n": 7, "text": "프로그램의 실행 결과를 근거로 오류 원인을 분석하고 적절한 개선책을 마련함."}, {"level": "상위", "n": 8, "text": "자료의 구조와 처리 과정을 이해하고 효율적인 구현 방법을 적극적으로 탐색함."}, {"level": "상위", "n": 9, "text": "탐구 목표에 맞게 수행 계획을 수립하고 각 단계를 책임감 있게 실천함."}, {"level": "상위", "n": 10, "text": "새로운 개념을 기존 지식과 연결하여 문제 해결에 활용하는 응용력이 돋보임."}, {"level": "상위", "n": 11, "text": "다양한 입력 사례를 활용해 프로그램의 동작을 점검하는 검증 태도가 우수함."}, {"level": "상위", "n": 12, "text": "수행 과정에서 받은 피드백을 반영하여 해결 방법을 꾸준히 개선함."}, {"level": "상위", "n": 13, "text": "자료를 체계적으로 정리하고 분석 결과를 명확한 근거와 함께 설명함."}, {"level": "상위", "n": 14, "text": "모둠 활동에서 자신의 역할을 충실히 수행하며 의견 교환에 적극적으로 참여함."}, {"level": "상위", "n": 15, "text": "문제 해결에 필요한 도구와 자료를 적절히 활용하여 탐구의 효율성을 높임."}, {"level": "상위", "n": 16, "text": "코드의 가독성과 재사용성을 고려하여 프로그램을 체계적으로 구성함."}, {"level": "상위", "n": 17, "text": "정보기술 활용 과정에서 정확성과 책임의 중요성을 인식하고 실천함."}, {"level": "상위", "n": 18, "text": "과제의 요구 사항을 정확히 파악하고 계획한 기능을 안정적으로 구현함."}, {"level": "상위", "n": 19, "text": "탐구 결과를 되돌아보며 강점과 보완점을 구체적으로 정리하는 태도가 돋보임."}, {"level": "상위", "n": 20, "text": "꾸준한 학습과 적극적인 실습을 바탕으로 문제 해결 능력을 안정적으로 확장함."}, {"level": "보통", "n": 1, "text": "기본 개념을 이해하고 안내된 절차에 따라 문제 해결 활동을 성실하게 수행함."}, {"level": "보통", "n": 2, "text": "주어진 예제를 분석하며 알고리즘의 기본 원리를 차근차근 익혀 나감."}, {"level": "보통", "n": 3, "text": "학습한 내용을 실습에 적용하려는 노력을 지속하며 이해의 폭을 넓혀 감."}, {"level": "보통", "n": 4, "text": "교사의 피드백을 수용하고 오류를 수정하며 과제 수행 능력을 향상시킴."}, {"level": "보통", "n": 5, "text": "기초적인 자료 처리 방법을 익히고 간단한 프로그램 구현에 활용함."}, {"level": "보통", "n": 6, "text": "문제의 입력과 출력을 구분하고 해결 과정을 순서대로 정리하는 모습을 보임."}, {"level": "보통", "n": 7, "text": "반복적인 실습을 통해 주요 문법과 프로그래밍 절차에 대한 이해를 높임."}, {"level": "보통", "n": 8, "text": "활동 중 어려운 부분을 질문하고 해결 방법을 확인하며 학습을 이어 감."}, {"level": "보통", "n": 9, "text": "예시 코드를 참고하여 기능을 수정하고 실행 결과를 확인하는 경험을 쌓음."}, {"level": "보통", "n": 10, "text": "주어진 조건을 하나씩 확인하며 과제의 핵심 요구 사항을 충실히 수행함."}, {"level": "보통", "n": 11, "text": "기본적인 오류를 찾아 수정하는 활동에 참여하며 점검 습관을 형성함."}, {"level": "보통", "n": 12, "text": "자료를 정리하고 결과를 기록하는 과정을 통해 탐구의 기본 태도를 기름."}, {"level": "보통", "n": 13, "text": "모둠 활동에서 맡은 역할을 수행하며 협력적 문제 해결의 중요성을 이해함."}, {"level": "보통", "n": 14, "text": "새로운 정보과학 개념에 관심을 갖고 학습 활동에 꾸준히 참여함."}, {"level": "보통", "n": 15, "text": "안내된 알고리즘을 따라 실행 흐름을 확인하며 기초적인 분석 능력을 기름."}, {"level": "보통", "n": 16, "text": "실습 결과를 예상과 비교하고 차이가 발생한 이유를 알아보려 노력함."}, {"level": "보통", "n": 17, "text": "학습 자료와 예제를 활용하여 부족한 부분을 보완하는 태도를 보임."}, {"level": "보통", "n": 18, "text": "간단한 문제를 단계별로 분해하고 해결 절차를 구성하는 경험을 쌓음."}, {"level": "보통", "n": 19, "text": "프로그램의 실행과 수정 과정을 반복하며 기본적인 구현 자신감을 키움."}, {"level": "보통", "n": 20, "text": "꾸준한 참여와 과제 수행을 바탕으로 정보과학 학습의 기초를 다져 감."}];let filter='전체';const root=document.getElementById('cards'),stats=document.getElementById('stats'),search=document.getElementById('search');function selected(){let q=search.value.trim();return items.filter(x=>(filter==='전체'||x.level===filter)&&x.text.includes(q))}function render(){let arr=selected();stats.textContent=`표시 ${arr.length}개 / 전체 60개`;root.replaceChildren();for(let x of arr){let c=document.createElement('article');c.className='card';let top=document.createElement('div');top.className='top';let tag=document.createElement('span');tag.className='tag '+(x.level==='상위'?'upper':x.level==='보통'?'normal':'');tag.textContent=x.level+' · '+String(x.n).padStart(2,'0');let b=document.createElement('button');b.className='copy';b.textContent='문장 복사';b.onclick=()=>copy(x.text,b);top.append(tag,b);let p=document.createElement('div');p.className='sentence';p.textContent=x.text;c.append(top,p);root.append(c)}}async function copy(t,b){try{await navigator.clipboard.writeText(t)}catch(e){let a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove()}let old=b.textContent;b.textContent='복사됨';setTimeout(()=>b.textContent=old,1200)}document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(z=>z.classList.toggle('active',z===b));render()});search.oninput=render;document.getElementById('copyAll').onclick=e=>copy(selected().map(x=>`${x.level} ${x.n}. ${x.text}`).join('\n'),e.currentTarget);render();</script></body></html>
